name: CI

# Pull requests run Linux only; macOS and Windows minutes cost several times
# more on a private repository, so those run on merges to main and by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TANDEM_FAKE_KEYCHAIN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The version comes from package.json's packageManager; naming it here too
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Protocol drift
        run: pnpm gen:protocol && git diff --exit-code packages/protocol
      - run: bash scripts/check-coverage.sh
      # F-DI-02 AC2: the Windows keyboard hook never consumes an event.
      - run: bash scripts/guards/no-consuming-hook.sh

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      - run: cargo test --workspace
      # F-DI-04 AC2 / F-DI-01 AC1: the real base.en model on the committed
      # fixture, cached by the catalog's hash so it downloads once.
      - name: Dictate model cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tandem-models
          key: tandem-models-${{ hashFiles('crates/tandem-voice/models/catalog.json') }}
      - name: Dictate transcription (whisper base.en)
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch-models.sh base.en
          cargo test -p tandem-voice --features whisper -- --include-ignored f_di_04_2 f_di_01_1

  test-ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Postgres and Redis for API tests
        run: pnpm infra:up
      - run: pnpm -r test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop tauri build --debug --no-bundle
      - name: Release build has no E2E test harness
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/check-release-harness.sh

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build and E2E dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev dbus xclip openbox
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: bash scripts/smoke-dev.sh
      - run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter desktop e2e

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p target && (cargo audit --json > target/audit.json || true)
      - run: pnpm audit --audit-level high --json > target/pnpm-audit.json || true
      - run: pnpm tsx scripts/check-waivers.ts --cargo target/audit.json --pnpm target/pnpm-audit.json
