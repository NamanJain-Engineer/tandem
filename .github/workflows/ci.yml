name: CI

# The free Actions minutes are 2,000 a month on this private repository,
# with macOS counting 10× and Windows 2×. October's ran out in a week, at
# 75–100 Linux minutes a pull request and 250–350 a push to main, so CI now
# runs on its own only what the gate leaves to a fresh machine (D-1009,
# docs/OPERATING.md §5a):
# - pull requests into product-m0-m5 run `quick`: spec coverage, rustfmt,
#   and every package's typecheck and ESLint (`pnpm -r lint`), with nothing
#   compiled and no tests;
# - each night `checks` runs the gate's Linux half on product-m0-m5's head,
#   unless that commit was already checked;
# - everything else runs by hand (Actions › CI › Run workflow): `full` adds
#   the web and desktop E2E, the release harness, tandem-host and the
#   Whisper test, and `platforms` adds macOS and Windows;
# - drafts, and pull requests that change only docs, run nothing.
on:
  pull_request:
    branches: [product-m0-m5]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "docs/**"]
  schedule:
    # 21:37 UTC (03:07 in India), after the day's merges.
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Also the web and desktop E2E, the release harness, tandem-host and the Whisper test (about 60 more Linux minutes)"
        type: boolean
        default: false
      platforms:
        description: "Also macOS and Windows (their minutes count 10× and 2×: about 500)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TANDEM_FAKE_KEYCHAIN: "1"

jobs:
  # Pull requests: the checks that need nothing compiled and no services.
  quick:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The version comes from package.json's packageManager; naming it here too
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-coverage.sh
      # F-DI-02 AC2: the Windows keyboard hook never consumes an event.
      - run: bash scripts/guards/no-consuming-hook.sh
      - run: cargo fmt --all --check
      - run: pnpm -r lint

  # Which commit `checks` takes: product-m0-m5's head at night, skipped when
  # that commit was already checked; a manual run's own commit.
  pick:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      run: ${{ github.event_name != 'schedule' || steps.checked.outputs.cache-hit != 'true' }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event_name == 'schedule' && 'product-m0-m5' || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - id: checked
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .ci-checked
          key: ci-checked-${{ steps.sha.outputs.sha }}
          lookup-only: true

  # The gate's Linux half (scripts/gate.sh) on a fresh machine, and the audit.
  checks:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.pick.outputs.sha }}" }
      - name: Disk for the workspace's build (the image's Android SDK, .NET and GHC)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      # Saved only from main's ref (the nightly), which every branch can restore.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-coverage.sh
      - run: bash scripts/guards/no-consuming-hook.sh
      - run: pnpm -r lint
      - name: Postgres, Redis, Mailpit and stripe-mock for the API tests
        run: pnpm infra:up
      - run: pnpm -r test
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      # F-CD-24: jj 0.34 (its release binary, checked), so the real-jj
      # tests run here; JJ_REQUIRED fails them rather than skip without it.
      - name: jj 0.34 for the real-jj tests
        run: |
          curl -sSLf -o /tmp/jj.tgz https://github.com/jj-vcs/jj/releases/download/v0.34.0/jj-v0.34.0-x86_64-unknown-linux-musl.tar.gz
          echo "1e8e1ede656fecba91ceb8248a76402a110017ad677d0ecfd1f2040f5543cfa3  /tmp/jj.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/jj.tgz -C /usr/local/bin ./jj
          jj --version
      - run: cargo test --workspace
        env: { JJ_REQUIRED: "1" }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
      - name: Protocol drift (changed, new or deleted generated files)
        run: |
          pnpm gen:protocol
          git diff --exit-code packages/protocol
          test -z "$(git status --porcelain packages/protocol)"
      # F-DI-04 AC2 / F-DI-01 AC1: the real base.en model on the committed
      # fixture, cached by the catalog's hash so it downloads once.
      - name: Dictate model cache
        if: inputs.full
        uses: actions/cache@v4
        with:
          path: ~/.cache/tandem-models
          key: tandem-models-${{ hashFiles('crates/tandem-voice/models/catalog.json') }}
      - name: Dictate transcription (whisper base.en)
        if: inputs.full
        run: |
          bash scripts/fetch-models.sh base.en
          cargo test -p tandem-voice --features whisper -- --include-ignored f_di_04_2 f_di_01_1
      - name: Audit (advisories without a waiver)
        run: |
          mkdir -p target
          cargo audit --json > target/audit.json || true
          pnpm audit --audit-level high --json > target/pnpm-audit.json || true
          pnpm tsx scripts/check-waivers.ts --cargo target/audit.json --pnpm target/pnpm-audit.json
      # Passed or failed, the night's commit isn't checked again; a cancelled
      # run is retried the next night.
      - name: Mark the commit checked
        if: (success() || failure()) && github.event_name == 'schedule'
        run: mkdir -p .ci-checked
      - if: (success() || failure()) && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .ci-checked
          key: ci-checked-${{ needs.pick.outputs.sha }}

  # By hand, with `platforms`: the workspace's tests on macOS and Windows
  # (Linux runs them in `checks`).
  test-rust:
    if: inputs.platforms
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      - run: cargo test --workspace

  # tandem-host for SSH hosts (F-RM-01, MILESTONES M14): static binaries for
  # the three host platforms, by hand: Linux with `full`, macOS with
  # `platforms`. release.yml builds its own.
  tandem-host:
    if: inputs.full || inputs.platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && inputs.platforms && '[{"platform":"linux-x86_64","os":"ubuntu-24.04"},{"platform":"linux-aarch64","os":"ubuntu-24.04"},{"platform":"macos-universal","os":"macos-14"}]' || inputs.platforms && '[{"platform":"macos-universal","os":"macos-14"}]' || '[{"platform":"linux-x86_64","os":"ubuntu-24.04"},{"platform":"linux-aarch64","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'linux-aarch64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        name: Zig linker for static musl builds
        run: pip install ziglang==0.13.0
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with: { tool: cargo-zigbuild }
      - name: Build
        shell: bash
        run: bash scripts/ci/build-tandem-host.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-host-${{ matrix.platform }}
          path: apps/desktop/src-tauri/resources/tandem-host/${{ matrix.platform }}/tandem-host

  # By hand, with `full`: the website's build and Playwright tests.
  web:
    if: inputs.full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  # By hand: the debug app on Linux and the release harness check (`full`),
  # on macOS and Windows with `platforms`.
  desktop-build:
    if: inputs.full || inputs.platforms
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && inputs.platforms && '["ubuntu-24.04","macos-14","windows-2022"]' || inputs.platforms && '["macos-14","windows-2022"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop tauri build --debug --no-bundle
      - name: Release build has no E2E test harness
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/check-release-harness.sh

  # By hand, with `full`: the desktop E2E against the API, web app and mocks.
  integration:
    if: inputs.full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux build and E2E dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev dbus xclip openbox bubblewrap
      - uses: taiki-e/install-action@v2
        with: { tool: tauri-driver }
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: bash scripts/smoke-dev.sh
      # F-CD-24: the same checked jj as `checks`, so E2E-M18-CD24-1 runs.
      - name: jj 0.34 for E2E-M18-CD24-1
        run: |
          curl -sSLf -o /tmp/jj.tgz https://github.com/jj-vcs/jj/releases/download/v0.34.0/jj-v0.34.0-x86_64-unknown-linux-musl.tar.gz
          echo "1e8e1ede656fecba91ceb8248a76402a110017ad677d0ecfd1f2040f5543cfa3  /tmp/jj.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/jj.tgz -C /usr/local/bin ./jj
          jj --version
      - run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter desktop e2e
        env: { JJ_REQUIRED: "1" }

  # The desktop E2E on Windows (D-1714): tauri-driver drives WebView2
  # through msedgedriver, which must match the runner's WebView2. Offline
  # (no API or mock servers, which need Docker): the specs in
  # apps/desktop/e2e/windows-smoke.txt. By hand, with `platforms`.
  e2e-windows:
    if: inputs.platforms
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with: { tool: tauri-driver }
      - name: msedgedriver for this WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key).pv
          Write-Output "WebView2 $v"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "TANDEM_NATIVE_DRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop e2e -- --spec-list e2e/windows-smoke.txt
        env:
          TANDEM_E2E_OFFLINE: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-results
          path: test-results/
