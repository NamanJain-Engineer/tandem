name: CI

# Pull requests run Linux only; macOS and Windows minutes cost several times
# more on a private repository, so those run on merges to main and by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TANDEM_FAKE_KEYCHAIN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The version comes from package.json's packageManager; naming it here too
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Protocol drift
        run: pnpm gen:protocol && git diff --exit-code packages/protocol
      - run: bash scripts/check-coverage.sh
      # F-DI-02 AC2: the Windows keyboard hook never consumes an event.
      - run: bash scripts/guards/no-consuming-hook.sh

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build UI assets for the Tauri crate
        run: pnpm --filter desktop build
      - run: cargo test --workspace
      # F-DI-04 AC2 / F-DI-01 AC1: the real base.en model on the committed
      # fixture, cached by the catalog's hash so it downloads once.
      - name: Dictate model cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tandem-models
          key: tandem-models-${{ hashFiles('crates/tandem-voice/models/catalog.json') }}
      - name: Dictate transcription (whisper base.en)
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch-models.sh base.en
          cargo test -p tandem-voice --features whisper -- --include-ignored f_di_04_2 f_di_01_1

  # tandem-host for SSH hosts (F-RM-01, MILESTONES M14): static binaries for
  # the three host platforms. macOS minutes cost more, so macOS builds on
  # merges to main and by hand, like test-rust.
  tandem-host:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"linux-x86_64","os":"ubuntu-24.04"},{"platform":"linux-aarch64","os":"ubuntu-24.04"}]' || '[{"platform":"linux-x86_64","os":"ubuntu-24.04"},{"platform":"linux-aarch64","os":"ubuntu-24.04"},{"platform":"macos-universal","os":"macos-14"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'linux-aarch64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl') }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Zig linker for static musl builds
        run: pip install ziglang==0.13.0 && cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: bash scripts/ci/build-tandem-host.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-host-${{ matrix.platform }}
          path: apps/desktop/src-tauri/resources/tandem-host/${{ matrix.platform }}/tandem-host

  test-ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Postgres and Redis for API tests
        run: pnpm infra:up
      - run: pnpm -r test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop tauri build --debug --no-bundle
      - name: Release build has no E2E test harness
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/check-release-harness.sh

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build and E2E dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev dbus xclip openbox bubblewrap
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up && pnpm db:migrate && pnpm db:seed && pnpm keys:dev
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: bash scripts/smoke-dev.sh
      - run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter desktop e2e

  # The desktop E2E on Windows (D-1714): tauri-driver drives WebView2
  # through msedgedriver, which must match the runner's WebView2. Offline
  # (no API or mock servers, which need Docker): the specs in
  # apps/desktop/e2e/windows-smoke.txt. Merges to main and by hand only.
  e2e-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-driver --locked
      - name: msedgedriver for this WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key).pv
          Write-Output "WebView2 $v"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "TANDEM_NATIVE_DRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop e2e -- --spec-list e2e/windows-smoke.txt
        env:
          TANDEM_E2E_OFFLINE: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-results
          path: test-results/

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p target && (cargo audit --json > target/audit.json || true)
      - run: pnpm audit --audit-level high --json > target/pnpm-audit.json || true
      - run: pnpm tsx scripts/check-waivers.ts --cargo target/audit.json --pnpm target/pnpm-audit.json
