# Attributions THIRD_PARTY_NOTICES.md needs beyond the Cargo and npm license
# data (F-TL-04 AC2): downloaded models, bundled fonts, and the system
# libraries the Linux AppImage ships (LGPL: their licence text and the right
# to replace them are part of the notice). scripts/gen-notices.ts reads this
# file and crates/tandem-voice/models/catalog.json; it fails when a model in
# the catalog has no entry here.

[[model]]
id = "parakeet-tdt-0.6b-v3-int8"
name = "NVIDIA Parakeet TDT 0.6B v3 (ONNX int8)"
license = "CC-BY-4.0"

[[model]]
id = "whisper-large-v3-turbo-q5_0"
name = "OpenAI Whisper large-v3-turbo (GGML q5_0)"
license = "MIT"

[[model]]
id = "whisper-base.en"
name = "OpenAI Whisper base.en (GGML)"
license = "MIT"

[[model]]
id = "distil-whisper-large-v3.5"
name = "Distil-Whisper large-v3.5 (GGML)"
license = "MIT"

# Bundled under crates/tandem-voice/models/wake/ (F-CN-07), not in the catalog.
[[model]]
id = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
name = "sherpa-onnx keyword spotter, zipformer GigaSpeech 3.3M (ONNX int8)"
license = "Apache-2.0"
url = "https://github.com/k2-fsa/sherpa-onnx/releases/tag/kws-models"
copyright = "Trained by the k2-fsa project (icefall) on GigaSpeech; used for the \"Hey Conductor\" wake phrase."
bundled = true

[[font]]
