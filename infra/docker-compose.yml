services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
      POSTGRES_DB: tandem
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  stripe-mock:
    image: stripe/stripe-mock:v0.197.0
    ports:
      - "12111:12111"
    # A real request (any test key works). Compose v2, which CI runs, fails
    # `up --wait` on a disabled healthcheck: "has no healthcheck configured".
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Authorization: Bearer sk_test_123", "http://127.0.0.1:12111/v1/customers"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The SSH host for remote workspaces (F-RM-01, MILESTONES M14). Not started
  # by `pnpm infra:up`; run scripts/gen-ssh-fixture.sh first, then
  #   docker compose -f infra/docker-compose.yml --profile remote up -d --wait sshd
  sshd:
    profiles: ["remote"]
    build: ./ssh
    image: tandem-sshd:dev
    ports:
      - "2222:22"
    volumes:
      - ./ssh/id_ed25519.pub:/fixture/id_ed25519.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
