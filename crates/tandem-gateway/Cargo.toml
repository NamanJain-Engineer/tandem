[package]
name = "tandem-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
rand.workspace = true
reqwest.workspace = true
futures.workspace = true
hex.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tandem-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
zeroize.workspace = true
chrono.workspace = true

[dev-dependencies]
# Integration tests use the test vendor modules.
tandem-gateway = { path = ".", features = ["test-vendors"] }
reqwest.workspace = true
wiremock.workspace = true
tempfile.workspace = true

[features]
# Test-only vendor modules (`test_echo` and friends); never in a release.
test-vendors = []

[lints]
workspace = true

[[bin]]
name = "mock-plugins"
path = "src/bin/mock_plugins.rs"
required-features = ["test-vendors"]
