[package]
name = "tandem-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The wake-phrase keyword spotter as a sidecar (F-CN-07): its ONNX Runtime
# can't share the app binary with Parakeet's.
name = "tandem-wake"
required-features = ["kws"]

[features]
default = ["cpal"]
# The OS microphone and chimes through cpal (ALSA on Linux).
cpal = ["dep:cpal"]
# Local Whisper models through whisper.cpp (F-DI-04).
whisper = ["dep:whisper-rs"]
# Parakeet through ONNX Runtime (F-DI-04); not built for Intel Macs.
parakeet = ["dep:transcribe-rs"]
# The "Hey Conductor" wake phrase through a bundled sherpa-onnx keyword
# spotter (F-CN-07).
kws = ["dep:sherpa-onnx"]

[dependencies]
tandem-core.workspace = true
aho-corasick.workspace = true
futures.workspace = true
hex.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
hound = "3.5"
rtrb = "0.3"
rubato = "0.16"
cpal = { version = "0.15", optional = true }
whisper-rs = { version = "0.15", optional = true }
transcribe-rs = { version = "0.3", optional = true, default-features = false, features = ["onnx"] }
sherpa-onnx = { version = "=1.13.8", optional = true }
arboard = "3.6"
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true

[lints]
workspace = true
