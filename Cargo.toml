[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "tests/invariants"]

[workspace.package]
edition = "2021"
# All rights reserved until the owner picks an open-source licence (D-870),
# the same as the Flatpak and Snap metadata.
license = "LicenseRef-proprietary"
version = "0.9.0"
publish = false

[workspace.dependencies]
# F-WT-10 intent radar: parsers for the changed-symbol index (D-2528).
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tandem-core = { path = "crates/tandem-core", default-features = false }
tandem-store = { path = "crates/tandem-store" }
tandem-pty = { path = "crates/tandem-pty" }
tandem-engines = { path = "crates/tandem-engines" }
tandem-git = { path = "crates/tandem-git" }
tandem-gateway = { path = "crates/tandem-gateway" }
tandem-tasks = { path = "crates/tandem-tasks" }
tandem-routines = { path = "crates/tandem-routines" }
# Members ask for the OS microphone (`cpal`) themselves (D-2105).
tandem-voice = { path = "crates/tandem-voice", default-features = false }
tandem-host = { path = "crates/tandem-host" }

aes-gcm = "0.10"
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
dashmap = "6"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
httparse = "1"
if-addrs = "0.15"
# No network transports: reads only; the git CLI does fetch/push (ARCHITECTURE §7).
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
iana-time-zone = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify = "8"
parking_lot = "0.12"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio-util = "0.7"
# The phone relay client and the Conductor realtime client (ARCHITECTURE §12.6);
# TLS through rustls, as reqwest.
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "fs", "net"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
ulid = "1"
url = "2"
vte = "0.15"
wiremock = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
unicode-normalization = "0.1"
zeroize = "1"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `pnpm --filter desktop perf`: release optimisations with the debug-only
# test harness (cfg!(debug_assertions)) still compiled in, so the suites can
# read the app's counters. Never shipped. LTO and codegen units match release
# so the budgets measure code shaped like the shipped binary (D-140); a clean
# build takes about 25 minutes.
[profile.perf]
inherits = "release"
debug-assertions = true
strip = "none"

# Dependencies keep line tables only in dev builds: full DWARF for whisper.cpp,
# ONNX Runtime, WebKit bindings and the rest outgrew the build machines'
# disk (D-511). Workspace crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
