  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "LGPL-2.1-or-later",
  "NCSA",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
