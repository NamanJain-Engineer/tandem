[package]
name = "tandem-desktop"
description = "Tandem desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tandem_app"
path = "src/lib.rs"

[[bin]]
name = "tandem"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem-core.workspace = true
tandem-engines.workspace = true
tandem-gateway.workspace = true
tandem-git.workspace = true
tandem-pty.workspace = true
tandem-routines.workspace = true
tandem-store.workspace = true
tandem-tasks.workspace = true
aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
rusqlite.workspace = true
regex.workspace = true
futures.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
zeroize.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
png = "0.17"
notify-rust = "4"
ignore.workspace = true
# Browser panes (F-CD-17): wry webviews of our own, outside Tauri's IPC.
# Same version and features as tauri-runtime-wry, so nothing builds twice.
wry = { version = "0.57.0", default-features = false, features = ["os-webview", "linux-body"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Tauri uses this to switch between dev server and bundled assets.
custom-protocol = ["tauri/custom-protocol"]
# The gateway's test vendor modules (`test_echo` …), for E2E builds only.
test-vendors = ["tandem-gateway/test-vendors"]

[lints]
workspace = true
